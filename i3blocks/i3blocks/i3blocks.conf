# i3blocks config file

# Global properties (must be FIRST)
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none

###############################################################################
# Window Title
###############################################################################
[window_title]
label=
command=/home/$USER/.config/i3blocks/my-i3blocks-scripts/arch-scripts/window_title
interval=1
color=#f43213

###############################################################################
# Volume
###############################################################################
[volume]
label=♪
instance=Master
interval=once
signal=10

###############################################################################
# Memory
###############################################################################
[memory]
label=Mem
command=~/.config/i3blocks/my-i3blocks-scripts/arch-scripts/memory
interval=3

###############################################################################
# Disk usage
###############################################################################
[disk]
label=HOME
interval=30

###############################################################################
# Network
###############################################################################
[iface]
color=#00FF00
interval=7
separator=false

[wifi]
interval=3
separator=false

[bandwidth]
interval=5

###############################################################################
# CPU
###############################################################################
[cpu_usage]
separator=true
color=#728b35
command=~/.config/i3blocks/my-i3blocks-scripts/arch-scripts/cpu_usage
interval=5
min_width=CPU: 100.00%

###############################################################################
# Time
###############################################################################
[time]
command=date '+%Y-%m-%d %H:%M'
interval=60

###############################################################################
# Battery
###############################################################################
[battery]
label=
command=/home/$USER/.config/i3blocks/my-i3blocks-scripts/arch-scripts/battery
interval=10
color=#add8e6

